services:
    lb:
        image: haproxy
        ports:
            - "8080:8080"
        volumes:
            - ./haproxy:/usr/local/etc/haproxy
    ws1:
        build: .
        environment:
            - APPID=1111
        volumes:
            - .:/usr/src/app
        command: ["npm", "run", "debug"]
